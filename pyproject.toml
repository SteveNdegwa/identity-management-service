[project]
name = "idms"
version = "0.1.0"
authors = [
    { name = "Eutychus Towett", email = "ektowett@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.11.1",
    "bcrypt==5.0.0",
    "boto3==1.43.13",
    "botocore==1.43.13",
    "cffi==2.0.0",
    "cryptography==48.0.0",
    "Django==6.0.5",
    "django-cors-headers==4.9.0",
    "django-storages==1.14.6",
    "gunicorn==26.0.0",
    "jmespath==1.1.0",
    "phonenumberslite==9.0.30",
    "pycparser==3.0",
    "PyJWT==2.13.0",
    "pyotp==2.9.0",
    "psycopg[binary]==3.3.4",
    "python-dateutil==2.9.0.post0",
    "ruff==0.15.14",
    "s3transfer==0.17.0",
    "six==1.17.0",
    "sqlparse==0.5.5",
    "urllib3==2.7.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "**/migrations/*",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line-too-long (the formatter handles this)
]

[tool.ruff.lint.per-file-ignores]
"**/settings.py" = ["F403", "F405"]
"**/tests.py" = ["S101"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
